<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROOT NOTES</title>
<meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<!-- タイトル。絵・書体・配置は仮（A区分。Codex の絵が採用されてから決める） -->
<main class="title" id="title-screen" aria-label="ルート・ノーツのタイトル">
  <p class="series" id="app-series"></p>
  <h1 class="logo" aria-label="ROOT NOTES（ルート・ノーツ）">ROOT NOTES</h1>
  <p class="lead">星の和音を、三角形でつくる。</p>
  <nav class="title-menu" aria-label="はじめのメニュー">
    <button type="button" class="big" data-start="select">三角形のステージ（選択プレイ）</button>
    <button type="button" data-start="free">連続プレイ（フリー）</button>
    <div class="pair">
      <button type="button" data-start="normal">ノーマル</button>
      <button type="button" data-start="expert">エキスパート</button>
    </div>
  </nav>
  <footer class="foot"><span id="app-copyright"></span><span id="app-version"></span></footer>
</main>

<!-- 遊ぶ画面（段階3）。縦向きは1列、横向きは左に三角形・右に操作の2列（style.css） -->
<div class="app" id="stage-screen" hidden>
  <header class="head">
    <h1 class="brand">ROOT NOTES</h1>
    <button type="button" class="chip" id="mode-chip" aria-label="遊び方を変える"></button>
    <button type="button" class="icon" id="menu-button" aria-label="メニュー（遊び方・曲・発見の巻物）">☰</button>
  </header>
  <nav class="stars" id="stars" aria-label="8小節の星"></nav>
  <div class="sub"><span id="where"></span><span id="lives" aria-label="失敗の残り"></span></div>
  <section class="board" aria-label="三角形">
    <svg id="tri" viewBox="0 0 320 210" preserveAspectRatio="xMidYMid meet" role="img" aria-label="選んだ棒でできる三角形。辺をタップするかなぞると、その辺の音が鳴る"></svg>
    <div class="status">
      <div class="meter" id="meter" hidden></div>
      <p id="msg" role="status" aria-live="polite"></p>
      <p id="info"></p>
    </div>
  </section>
  <div class="sticks" id="sticks" aria-label="棒"></div>
  <div class="actions">
    <button type="button" class="btn" id="b-target">お題を<br>聞く</button>
    <button type="button" class="btn" id="b-chord">和音で<br>鳴らす</button>
    <button type="button" class="btn" id="b-compare">比べる</button>
    <button type="button" class="btn" id="b-meter">メーター</button>
    <button type="button" class="btn primary" id="b-answer">回答する</button>
  </div>
</div>

<!-- 引き出し（遊び方・曲・発見の巻物・設定） -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" id="sheet-back"></div>
  <div class="sheet-body" role="dialog" aria-label="メニュー">
    <h2>遊び方を選ぶ</h2>
    <div class="modes" id="modes"></div>
    <p id="mode-desc"></p>
    <h2>今回の曲</h2>
    <p id="song-info"></p>
    <button type="button" class="btn" id="b-song">灯った和音で曲を聴く</button>
    <h2>曲の余韻（聞き比べ）</h2>
    <div class="seg"><button type="button" id="carry-off">小節の中で切る</button><button type="button" id="carry-on">次の小節へ残す</button></div>
    <h2>発見の巻物</h2>
    <ul class="found" id="found"></ul>
    <div id="meter-setting">
      <h2>メーター（フリー）</h2>
      <div class="seg"><button type="button" id="meter-on">表示</button><button type="button" id="meter-off">隠す</button></div>
    </div>
    <h2>遊び方</h2>
    <p>8つの星が、1曲の8小節です。星ごとにお題の和音を聞き、同じ響きの三角形を棒から作ってください。辺をタップ（なぞる）すると1音ずつ鳴ります。</p>
    <p>4つの星を灯すたびに、そこまでの和音がベースライン付きのフレーズとして流れます。8つ全部で1曲になります。</p>
    <p>色は音の高さで決まり、1オクターブ違う音は同じ色です。</p>
    <button type="button" class="btn" id="b-reveal" hidden>確認用：答えを見る</button>
    <div class="sheet-foot"><span id="sheet-version"></span><span id="sheet-copyright"></span></div>
    <div class="sheet-buttons">
      <button type="button" class="btn" id="b-title">タイトルへ</button>
      <button type="button" class="btn primary" id="b-close">閉じる</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./src/ui/main.js"></script>
</body>
</html>
