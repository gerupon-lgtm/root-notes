<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>弦の音の試聴</title>
<style>
  :root { color-scheme: dark; --night: #062522; --panel: #0a302c; --line: #53736a; --ink: #f2e9d8; --mute: #a5bdb1; --gold: #d9bb6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 1.25rem; color: var(--gold); margin: 4px 0 6px; }
  p { margin: 6px 0; color: var(--mute); font-size: 0.9rem; }
  section { margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  h2 { margin: 0 0 4px; font-size: 1.05rem; }
  h2 small { color: var(--mute); font-weight: 400; font-size: 0.8rem; margin-left: 6px; }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  button { min-height: 54px; border-radius: 12px; border: 1px solid #b69b60; background: #062522; color: var(--ink); font: inherit; font-weight: 700; font-size: 0.92rem; padding: 4px 6px; }
  button.wide { grid-column: 1 / -1; background: linear-gradient(110deg, #ecd083, #c8a556); color: #18231c; border-color: #dcc28c; }
  button:active { background: #d9bb6b; color: #18231c; }
  .note { font-size: 0.8rem; }
</style>
</head>
<body>
<main>
  <h1>弦の音の試聴（ROOT NOTES）</h1>
  <p>第1章・章末の謎・序章の琴で使う「弦の音」の候補です。どれもアコースティックギターのようにピッキングのアタックがあり、196Hz（第1章の弦全体）で 1.1秒の間に消えます。ほかの高さも同じ長さで消えます。</p>
  <p class="note">「重ねて（揺れ1回/秒）」は、第1章の「重ねて鳴らす」と謎の「重ねて聞く」用です。ここだけは消えずに鳴り続け、392Hz と 393Hz を重ねて、1秒に1回の揺れを 4秒聞かせます。</p>
  <div id="list"></div>
</main>
<script>
// 試聴だけのページ（本体には読み込まない）。候補は3つ：
// A：FM（変調の深さが急に減って、明るい音からやわらかい音へ）、B：弦の物理モデル（カープラス・ストロング。雑音を弦の長さの遅れで何度も回す）、
// C：倍音を重ねる（高い倍音ほど早く消える）。比べるために、今の音（オルガン）も置く
let ctx = null, out = null;
function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 0.03 });
    out = ctx.createGain(); out.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -3; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = 0.002; comp.release.value = 0.1;
    out.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
const LIFE = 1.1; // 消えるまでの秒数
// 音量の形：すぐ立ち上がり、指数で減り、LIFE 秒でちょうど0（最後の0.08秒は直線で0へ）
function envelope(g, t, peak, life = LIFE, tau = 0.22) {
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.003);
  g.gain.setTargetAtTime(0, t + 0.003, tau);
  const fadeAt = t + life - 0.08;
  g.gain.setValueAtTime(peak * Math.exp(-(life - 0.083) / tau), fadeAt);
  g.gain.linearRampToValueAtTime(0, t + life);
}
// ピッキングのアタック：とても短い雑音（高い音を残す）
function pick(t, level = 0.18, bright = 2600) {
  const c = audio(), n = Math.floor(c.sampleRate * 0.025), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n * 0.18));
  const src = c.createBufferSource(), hp = c.createBiquadFilter(), g = c.createGain();
  src.buffer = buf; hp.type = 'bandpass'; hp.frequency.value = bright; hp.Q.value = 0.8; g.gain.value = level;
  src.connect(hp); hp.connect(g); g.connect(out); src.start(t);
}

// A：FM。変調の倍率1、深さ 3.5 → 0.25（時定数 0.09 秒）
function fmVoice(hz, t, { life = LIFE, sustain = false, level = 0.22 } = {}) {
  const c = audio(), car = c.createOscillator(), mod = c.createOscillator(), dep = c.createGain(), g = c.createGain();
  car.frequency.value = hz; mod.frequency.value = hz;
  dep.gain.setValueAtTime(hz * 3.5, t); dep.gain.setTargetAtTime(hz * (sustain ? 0.6 : 0.25), t, 0.09);
  mod.connect(dep); dep.connect(car.frequency); car.connect(g); g.connect(out);
  if (sustain) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + 0.003); g.gain.setTargetAtTime(level * 0.45, t + 0.003, 0.25); g.gain.setValueAtTime(level * 0.45, t + life - 0.1); g.gain.linearRampToValueAtTime(0, t + life); }
  else envelope(g, t, level, life);
  for (const o of [car, mod]) { o.start(t); o.stop(t + life + 0.05); }
  pick(t, 0.14, 3000);
}

// B：弦の物理モデル（カープラス・ストロング）。音の形は計算して作り、最後は LIFE で0にする
function ksBuffer(hz, life) {
  const c = audio(), sr = c.sampleRate, N = Math.max(2, Math.round(sr / hz)), len = Math.ceil(sr * life), d = new Float32Array(len);
  const line = new Float32Array(N);
  let prev = 0;
  for (let i = 0; i < N; i++) { const r = Math.random() * 2 - 1; line[i] = 0.6 * r + 0.4 * prev; prev = line[i]; } // 少し丸めた雑音（指先のやわらかさ）
  let idx = 0;
  const damp = 0.996;
  for (let i = 0; i < len; i++) {
    const a = line[idx], b = line[(idx + 1) % N], v = damp * 0.5 * (a + b);
    d[i] = a; line[idx] = v; idx = (idx + 1) % N;
  }
  return d;
}
function ksVoice(hz, t, { life = LIFE, sustain = false, level = 0.5 } = {}) {
  if (sustain) { addVoice(hz, t, { life, sustain: true, level: 0.2, tilt: 1.4 }); return; } // 物理モデルは保てないので、保つ音は倍音を重ねる形で同じ明るさに
  const c = audio(), data = ksBuffer(hz, life), buf = c.createBuffer(1, data.length, c.sampleRate);
  buf.getChannelData(0).set(data);
  const src = c.createBufferSource(), g = c.createGain(), lp = c.createBiquadFilter();
  src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = Math.min(9000, hz * 14);
  src.connect(lp); lp.connect(g); g.connect(out);
  envelope(g, t, level, life, 0.3);
  src.start(t);
  pick(t, 0.1, 3400);
}

// C：倍音を重ねる。倍音 n の強さは 1/n^tilt、n が高いほど早く消える。胴の響き（200Hz あたり）を少し足す
function addVoice(hz, t, { life = LIFE, sustain = false, level = 0.2, tilt = 1.15 } = {}) {
  const c = audio(), sum = c.createGain(), body = c.createBiquadFilter(), g = c.createGain();
  body.type = 'peaking'; body.frequency.value = 200; body.Q.value = 1; body.gain.value = 4;
  sum.connect(body); body.connect(g); g.connect(out);
  for (let n = 1; n <= 10; n++) {
    if (hz * n > 9000) break;
    const o = c.createOscillator(), a = c.createGain(), amp = 1 / Math.pow(n, tilt);
    o.frequency.value = hz * n;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(amp, t + 0.003);
    if (sustain) a.gain.setTargetAtTime(amp * (n === 1 ? 0.8 : 0.35 / n), t + 0.003, 0.25);
    else a.gain.setTargetAtTime(0, t + 0.003, 0.32 / Math.sqrt(n));
    o.connect(a); a.connect(sum); o.start(t); o.stop(t + life + 0.05);
  }
  if (sustain) { g.gain.setValueAtTime(level, t); g.gain.setValueAtTime(level, t + life - 0.1); g.gain.linearRampToValueAtTime(0, t + life); }
  else envelope(g, t, level, life, 0.3);
  pick(t, 0.12, 2400);
}

// 今の音（オルガン。比べる用）：倍音1〜8を足した波形を、1.1秒保ってから短く消す
const RANKS = [1, 0.65, 0.35, 0.55, 0.18, 0.2, 0.12, 0.35];
function organVoice(hz, t, { life = LIFE, level = 0.14 } = {}) {
  const c = audio(), real = new Float32Array(9), imag = new Float32Array(9);
  RANKS.forEach((v, i) => { imag[i + 1] = v; });
  const o = c.createOscillator(), g = c.createGain();
  o.setPeriodicWave(c.createPeriodicWave(real, imag)); o.frequency.value = hz;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + 0.004); g.gain.setValueAtTime(level, t + life); g.gain.linearRampToValueAtTime(0, t + life + 0.04);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + life + 0.1);
}

const CANDIDATES = [
  { name: 'A：FM', note: '明るいアタックから、すぐやわらかい音へ', play: fmVoice },
  { name: 'B：弦の物理モデル', note: '本物の弦に近い、少しざらっとした音', play: ksVoice },
  { name: 'C：倍音を重ねる', note: '胴の響きがある、やわらかめの音', play: addVoice },
  { name: '今の音：オルガン', note: '比べる用', play: organVoice, organ: true }
];
const NOTES = [['196Hz（弦全体）', 196], ['392Hz（1オクターブ上）', 392], ['466Hz（盾の声の高さ）', 465.64], ['1397Hz（いちばん高い弦）', 1396.92]];

const list = document.getElementById('list');
for (const cand of CANDIDATES) {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${cand.name}<small>${cand.note}</small></h2>`;
  const row = document.createElement('div'); row.className = 'row';
  for (const [label, hz] of NOTES) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.addEventListener('click', () => { const c = audio(); cand.play(hz, c.currentTime + 0.03); });
    row.append(b);
  }
  const seq = document.createElement('button'); seq.type = 'button'; seq.textContent = 'ソ・レ・ソ（続けて）';
  seq.addEventListener('click', () => { const c = audio(), t = c.currentTime + 0.03; [196, 293.66, 392].forEach((hz, i) => cand.play(hz, t + i * 0.45)); });
  row.append(seq);
  const both = document.createElement('button'); both.type = 'button'; both.textContent = '重ねて（揺れ1回/秒）';
  both.addEventListener('click', () => {
    const c = audio(), t = c.currentTime + 0.03;
    if (cand.organ) { organVoice(392, t, { life: 4 }); organVoice(393, t, { life: 4 }); return; }
    cand.play(392, t, { life: 4, sustain: true, level: cand.play === ksVoice ? 0.2 : 0.16 });
    cand.play(393, t, { life: 4, sustain: true, level: cand.play === ksVoice ? 0.2 : 0.16 });
  });
  row.append(both);
  sec.append(row);
  list.append(sec);
}
</script>
</body>
</html>
