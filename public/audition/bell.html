<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鐘の音の試聴</title>
<style>
  :root { color-scheme: dark; --night: #062522; --panel: #0a302c; --line: #53736a; --ink: #f2e9d8; --mute: #a5bdb1; --gold: #d9bb6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 1.25rem; color: var(--gold); margin: 4px 0 6px; }
  p { margin: 6px 0; color: var(--mute); font-size: 0.9rem; }
  section { margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  h2 { margin: 0 0 4px; font-size: 1.05rem; }
  h2 small { color: var(--mute); font-weight: 400; font-size: 0.8rem; margin-left: 6px; }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  button { min-height: 54px; border-radius: 12px; border: 1px solid #b69b60; background: #062522; color: var(--ink); font: inherit; font-weight: 700; font-size: 0.92rem; padding: 4px 6px; }
  button:active { background: #d9bb6b; color: #18231c; }
</style>
</head>
<body>
<main>
  <h1>鐘の音の試聴（ROOT NOTES）</h1>
  <p>序章と結末で鳴る鐘（大きさ 12・9・8・6 ＝ ファ・シ♭・ド・高いファ）の候補です。今の鐘は PRISM と同じ作り（揺らす側の高さが √2 倍の FM）で、整数倍に並ばない倍音が多く、重ねると濁って聞こえます。</p>
  <p>候補はどれも、複雑な倍音を控えて、澄んで聞こえる方向にしています。鳴り方（打った瞬間の立ち上がりと、2.6秒の余韻）はすべて同じにして、音色だけを比べられるようにしています。</p>
  <div id="list"></div>
</main>
<script>
// 試聴だけのページ（本体には読み込まない）。2026-11-15 発案者「鐘を重ねると濁る。澄んだ音に。3パターンほど」
let ctx = null, out = null;
function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 0.03 });
    out = ctx.createGain(); out.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -3; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = 0.002; comp.release.value = 0.1;
    out.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
const BASE = 349.23;
const BELL = { 12: BASE, 9: BASE * 4 / 3, 8: BASE * 3 / 2, 6: BASE * 2 };
const LEN = 2.6;

// 鳴り方（全候補共通。PRISM の鐘と同じ）：3ミリ秒で立ち上がり、0.6秒までは時定数 0.325、そのあとは 0.18 で余韻が消える
function bellEnvelope(g, t, peak) {
  const bodyEnd = 0.6, body = peak * Math.exp(-(bodyEnd - 0.003) / 0.325);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.003);
  g.gain.setTargetAtTime(0, t + 0.003, 0.325);
  g.gain.setValueAtTime(body, t + bodyEnd);
  g.gain.setTargetAtTime(0, t + bodyEnd, 0.18);
  g.gain.setValueAtTime(body * Math.exp(-(2.54 - bodyEnd) / 0.18), t + 2.54);
  g.gain.linearRampToValueAtTime(0, t + LEN);
}
// 打った瞬間の短い「カン」（高さ2倍の正弦波を 0.06秒）。PRISM と同じ考え方で、どの候補にも同じものを付ける
function strike(hz, t, level) {
  const c = audio(), o = c.createOscillator(), g = c.createGain();
  o.frequency.value = hz * 2;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.06 * level, t + 0.004); g.gain.setTargetAtTime(0, t + 0.004, 0.02);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.2);
}
// FM の鐘。ratio：揺らす側の高さ（何倍か）、i0 → i1：揺らす深さ（はじめ → 余韻。時定数 0.42 秒）
function fmBell(hz, t, { ratio, i0, i1, level = 1 }) {
  const c = audio(), car = c.createOscillator(), mod = c.createOscillator(), dep = c.createGain(), g = c.createGain();
  car.frequency.value = hz; mod.frequency.value = hz * ratio;
  dep.gain.setValueAtTime(hz * ratio * i0, t); dep.gain.setTargetAtTime(hz * ratio * i1, t, 0.42);
  mod.connect(dep); dep.connect(car.frequency); car.connect(g); g.connect(out);
  bellEnvelope(g, t, 0.2 * level);
  for (const o of [car, mod]) { o.start(t); o.stop(t + LEN + 0.05); }
  strike(hz, t, level);
}
// 倍音を重ねる鐘：整数倍の倍音だけ（1・2・3・4倍）。高い倍音ほど早く消え、余韻は基音（いちばん澄んだ音）だけが残る
function chime(hz, t, { level = 1 }) {
  const c = audio(), sum = c.createGain(), g = c.createGain();
  sum.connect(g); g.connect(out);
  for (const [n, amp, tau] of [[1, 1, 9], [2, 0.32, 0.5], [3, 0.1, 0.25], [4, 0.04, 0.15]]) {
    const o = c.createOscillator(), a = c.createGain();
    o.frequency.value = hz * n;
    a.gain.setValueAtTime(amp, t); a.gain.setTargetAtTime(0, t, tau);
    o.connect(a); a.connect(sum); o.start(t); o.stop(t + LEN + 0.05);
  }
  bellEnvelope(g, t, 0.17 * level);
  strike(hz, t, level);
}

const CANDIDATES = [
  { name: 'K1：澄んだ鐘', note: '整数倍の倍音だけの FM。基音がはっきり', play: (hz, t, level) => fmBell(hz, t, { ratio: 1, i0: 1.4, i1: 0.12, level }) },
  { name: 'K2：チャイム', note: '倍音を少しだけ重ね、余韻は基音だけ。いちばん澄んだ音', play: (hz, t, level) => chime(hz, t, { level }) },
  { name: 'K3：やわらかい鐘', note: '今の鐘（√2）の響きを少しだけ残し、揺らす深さを浅く', play: (hz, t, level) => fmBell(hz, t, { ratio: Math.SQRT2, i0: 1.6, i1: 0.1, level }) },
  { name: '今の鐘（PRISM と同じ）', note: '比べる用', play: (hz, t, level) => fmBell(hz, t, { ratio: Math.SQRT2, i0: 5.2, i1: 0.9, level }) }
];
// ボタン：[文言, [[鐘, 何秒後], ...]]
const PLAYS = [
  ['12→9→8→6（序章1）', [[12, 0], [9, 1], [8, 2], [6, 3]]],
  ['12と6（同時）', [[12, 0], [6, 0]]],
  ['12と8（同時）', [[12, 0], [8, 0]]],
  ['12と9（同時）', [[12, 0], [9, 0]]],
  ['9と8（濁る組。序章3）', [[9, 0], [8, 0]]],
  ['4つ一緒（結末）', [[12, 0], [9, 0], [8, 0], [6, 0]]],
  ['余韻の重なり（序章5）', [[12, 0], [8, 0.7], [6, 1.4]]]
];
const list = document.getElementById('list');
for (const cand of CANDIDATES) {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${cand.name}<small>${cand.note}</small></h2>`;
  const row = document.createElement('div'); row.className = 'row';
  for (const [label, hits] of PLAYS) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    // 同時に鳴らす数が多いほど1つずつを小さく（重ねても出口の安全装置に届かないように）
    const together = Math.max(...hits.map(([, at]) => hits.filter(h => h[1] === at).length));
    const level = together >= 3 ? 0.6 : together === 2 ? 0.8 : 1;
    b.addEventListener('click', () => { const c = audio(), t = c.currentTime + 0.03; for (const [n, at] of hits) cand.play(BELL[n], t + at, level); });
    row.append(b);
  }
  sec.append(row);
  list.append(sec);
}
window.audition = { fmBell, chime, BELL, setOut: (c, o) => { ctx = c; out = o; } };
</script>
</body>
</html>
